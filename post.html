<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SELVÈRE — Post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: "#FBFBF9",
              surface: "#F3F2EE",
              alabaster: "#EAE8E1",
              charcoal: "#1C1C1A",
              slateink: "#6E6D68",
              amberglow: "#C59B63",
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', "Times New Roman", "serif"],
              sans: ["Pretendard", "Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="min-h-screen bg-ivory font-sans text-charcoal antialiased">
    <header class="inner-header border-b border-alabaster bg-ivory">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4">
        <a href="index.html" class="font-serif text-xl tracking-[0.18em]">SELVÈRE</a>
        <nav class="hidden items-center gap-8 text-[13px] tracking-[0.12em] uppercase md:flex">
          <a class="hover:text-amberglow" href="index.html">Home</a>
          <a class="hover:text-amberglow" href="board.html" data-requires-auth data-board-nav>Board</a>
          <span data-admin-nav="hover:text-amberglow"></span>
        </nav>
        <div data-auth-slot></div>
      </div>
    </header>

    <main class="page-shell mx-auto max-w-3xl px-5 py-12">
      <a class="text-xs tracking-[0.14em] uppercase text-slateink" href="board.html" data-board-nav>← Board</a>
      <p class="mt-8 text-sm text-slateink" data-post-status>글을 불러오는 중...</p>
      <article id="post-article" class="hidden">
        <div class="flex items-start justify-between gap-4">
          <p class="text-[11px] tracking-[0.18em] uppercase text-amberglow" data-post-meta></p>
          <button
            class="hidden border border-alabaster px-3 py-2 text-[10px] tracking-[0.14em] uppercase"
            type="button"
            data-delete-post
          >
            글 삭제
          </button>
        </div>
        <h1 class="mt-3 font-serif text-3xl" data-post-title></h1>
        <p class="mt-8 whitespace-pre-wrap text-sm leading-7" data-post-body></p>

        <section class="mt-14 border-t border-alabaster pt-8">
          <p class="text-[11px] tracking-[0.18em] uppercase text-amberglow">Admin Reply</p>
          <h2 class="mt-2 font-serif text-2xl">답글</h2>
          <div class="mt-6 space-y-4" data-reply-list></div>
          <p class="mt-4 text-sm text-slateink" data-reply-empty>아직 답글이 없습니다.</p>
          <form id="reply-form" class="mt-8 hidden space-y-3">
            <label class="block text-xs text-slateink" for="reply-body">관리자 답글</label>
            <textarea
              class="form-field min-h-[120px] w-full border border-alabaster bg-ivory px-4 py-3 text-sm"
              id="reply-body"
              name="body"
            ></textarea>
            <p class="text-xs text-slateink">AI 버튼을 누르면 친절한 답글 초안이 채워집니다. 확인·수정 후 등록하세요.</p>
            <p class="text-xs text-red-500" data-reply-error></p>
            <div class="flex flex-wrap gap-2">
              <button
                class="border border-amberglow px-5 py-3 text-[11px] tracking-[0.16em] uppercase text-amberglow"
                type="button"
                data-ai-reply
              >
                AI
              </button>
              <button class="bg-charcoal px-5 py-3 text-[11px] tracking-[0.16em] uppercase text-ivory" type="submit">
                답글 등록
              </button>
            </div>
          </form>
        </section>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ai-assist.js"></script>
    <script src="js/post.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SELVÈRE Admin — Inbound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ivory: "#FBFBF9",
              surface: "#F3F2EE",
              alabaster: "#EAE8E1",
              charcoal: "#1C1C1A",
              slateink: "#6E6D68",
              amberglow: "#C59B63",
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', "Times New Roman", "serif"],
              sans: ["Pretendard", "Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="min-h-screen bg-ivory font-sans text-charcoal antialiased">
    <header class="border-b border-alabaster bg-ivory">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
        <p class="font-serif text-xl tracking-[0.18em]">SELVÈRE</p>
        <p class="text-[11px] tracking-[0.18em] uppercase text-slateink">Admin / Inbound</p>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-5 py-10">
      <section id="login-panel" class="mx-auto max-w-md bg-surface px-6 py-10">
        <p class="text-[11px] tracking-[0.18em] uppercase text-amberglow">Restricted</p>
        <h1 class="mt-3 font-serif text-3xl">관리자 로그인</h1>
        <p class="mt-3 text-sm leading-6 text-slateink">
          Supabase Authentication에 등록한 관리자 이메일과 비밀번호로 로그인하세요.
        </p>
        <form id="login-form" class="mt-8 space-y-4">
          <label class="block text-xs text-slateink" for="admin-email">이메일</label>
          <input
            class="form-field w-full border border-alabaster bg-ivory px-4 py-3 text-sm"
            id="admin-email"
            type="email"
            autocomplete="username"
          />
          <label class="block text-xs text-slateink" for="admin-password">비밀번호</label>
          <input
            class="form-field w-full border border-alabaster bg-ivory px-4 py-3 text-sm"
            id="admin-password"
            type="password"
            autocomplete="current-password"
          />
          <p class="text-xs text-red-500" data-login-error></p>
          <button
            class="w-full bg-charcoal px-6 py-3 text-[11px] tracking-[0.18em] uppercase text-ivory"
            type="submit"
          >
            Enter
          </button>
        </form>
      </section>

      <section id="board-panel" class="hidden">
        <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
          <div>
            <p class="text-[11px] tracking-[0.18em] uppercase text-amberglow">Inbound</p>
            <h1 class="mt-2 font-serif text-3xl">문의 관리</h1>
            <p class="mt-2 text-sm text-slateink">상태와 비고를 저장하면 Supabase inquiries 테이블에 바로 반영됩니다.</p>
          </div>
          <div class="flex gap-3">
            <button
              class="border border-alabaster px-4 py-2 text-[11px] tracking-[0.16em] uppercase"
              id="refresh-button"
              type="button"
            >
              Refresh
            </button>
            <button
              class="border border-alabaster px-4 py-2 text-[11px] tracking-[0.16em] uppercase"
              id="logout-button"
              type="button"
            >
              Logout
            </button>
          </div>
        </div>

        <p class="mt-4 text-sm text-slateink" data-board-status>목록을 불러오는 중...</p>
        <p class="mt-2 text-xs text-red-500" data-board-error></p>

        <div class="admin-table-wrap mt-6 overflow-x-auto border border-alabaster bg-ivory">
          <table class="min-w-[1100px] w-full text-left text-sm">
            <thead class="bg-surface text-[11px] uppercase tracking-[0.12em] text-slateink">
              <tr>
                <th class="px-3 py-3">접수일시</th>
                <th class="px-3 py-3">이름 / 회사</th>
                <th class="px-3 py-3">연락처</th>
                <th class="px-3 py-3">문의</th>
                <th class="px-3 py-3">상태</th>
                <th class="px-3 py-3">비고</th>
                <th class="px-3 py-3"></th>
              </tr>
            </thead>
            <tbody id="inquiry-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
